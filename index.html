<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mô phỏng 3D Hệ Mặt Trời (Three.js)</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #000;
    }

    #scene-container {
      width: 100%;
      height: 100%;
    }

    /* 🌟 Dòng chữ phát sáng */
    #title-text {
      position: absolute;
      bottom: 80px; /* nằm dưới nút “Dừng” */
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 1.3em;
      font-weight: bold;
      text-align: center;
      text-shadow:
        0 0 5px #00ffff,
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff;
      z-index: 150;
      line-height: 1.6em;
    }

    .control-btn {
      position: absolute;
      bottom: 130px; /* cao hơn dòng chữ */
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      padding: 10px 25px;
      font-size: 1.2em;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      z-index: 100;
    }

    .control-btn:hover {
      background-color: rgba(255, 255, 255, 0.4);
      color: black;
    }

    #controls {
      position: absolute;
      bottom: 200px;
      right: 30px; 
      background-color: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  
  <div id="scene-container"></div>
  
  <div id="controls"> 
    <label for="speedSlider" style="color: white; margin-right: 10px;">Tốc độ mô phỏng:</label>
    <input type="range" id="speedSlider" min="0.1" max="10" value="1" step="0.1">
  </div>

  <!-- 🎛️ Nút điều khiển chính -->
  <button class="control-btn" id="toggleButton">⏸️ Dừng</button>

  <!-- 🌟 Dòng chữ phát sáng -->
  <div id="title-text">
    Mô Phỏng Chuyển Động Quay Của Hệ Mặt Trời - Trái Đất - Mặt Trăng<br>
    Tác giả: Nguyễn Đức Anh ✨ &nbsp;&nbsp;|&nbsp;&nbsp; Người hướng dẫn: Nguyễn Duy Quyền ✨
  </div>

  <script>
    // --- KHỞI TẠO THREE.JS ---
    const scene = new THREE.Scene();

    // 🌌 ẢNH NỀN KHÔNG GIAN
    const textureLoader = new THREE.TextureLoader();
    scene.background = textureLoader.load('space.jpg');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); 
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('scene-container').appendChild(renderer.domElement);
    
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; 
    controls.dampingFactor = 0.05;
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- THAM SỐ ---
    const EARTH_TILT_RAD = 23.5 * Math.PI / 180;
    const ORBIT_RADIUS = 30; 
    const MOON_ORBIT_RADIUS = 5; 
    
    const BASE_SPEED = 0.0003; 
    const SUN_ROT_SPEED = 0.00003; 
    const EARTH_ORBIT_SPEED = BASE_SPEED * 1; 
    const EARTH_ROT_SPEED = BASE_SPEED * 365.25; 
    const MOON_ORBIT_SPEED = BASE_SPEED * 12.17; 

    let simulationSpeed = 1.0; 
    let isRunning = true;
    
    // --- TẠO VẬT THỂ ---
    // Mặt trời
    const sunGeometry = new THREE.SphereGeometry(4, 32, 32); 
    const sunMaterial = new THREE.MeshBasicMaterial({ 
        map: textureLoader.load('sun.jpg'),
        color: 0xffffee 
    });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);
    
    const light = new THREE.PointLight(0xffffff, 8, 0);
    sun.add(light); 
    
    const ambientLight = new THREE.AmbientLight(0x050505); 
    scene.add(ambientLight);

    // Trái đất
    const earthGeometry = new THREE.SphereGeometry(1.5, 32, 32);
    const earthMaterial = new THREE.MeshPhongMaterial({ 
        map: textureLoader.load('earth.jpg'),
        specular: 0x333333,
        shininess: 15
    });
    const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
    
    const earthOrbit = new THREE.Object3D();
    scene.add(earthOrbit); 

    const earthTilt = new THREE.Object3D();
    earthTilt.position.set(ORBIT_RADIUS, 0, 0); 
    earthTilt.rotation.x = EARTH_TILT_RAD; 
    earthOrbit.add(earthTilt); 
    earthTilt.add(earthMesh); 

    // Mặt trăng
    const moonGeometry = new THREE.SphereGeometry(0.4, 32, 32);
    const moonMaterial = new THREE.MeshPhongMaterial({
        map: textureLoader.load('moon.jpg')
    });
    const moon = new THREE.Mesh(moonGeometry, moonMaterial);
    moon.position.set(MOON_ORBIT_RADIUS, 0, 0); 
    
    const moonOrbit = new THREE.Object3D();
    moonOrbit.add(moon);
    earthMesh.add(moonOrbit); 

    // Quỹ đạo
    const orbitMaterial = new THREE.LineBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.1 });
    const earthOrbitGeometry = new THREE.RingGeometry(ORBIT_RADIUS - 0.05, ORBIT_RADIUS + 0.05, 128);
    const earthOrbitLine = new THREE.Line(earthOrbitGeometry, orbitMaterial);
    earthOrbitLine.rotation.x = Math.PI / 2; 
    scene.add(earthOrbitLine);

    const moonOrbitGeometry = new THREE.RingGeometry(MOON_ORBIT_RADIUS - 0.02, MOON_ORBIT_RADIUS + 0.02, 64);
    const moonOrbitLine = new THREE.Line(moonOrbitGeometry, orbitMaterial);
    moonOrbitLine.rotation.x = Math.PI / 2; 
    earthMesh.add(moonOrbitLine); 

    // Camera
    camera.position.set(0, ORBIT_RADIUS * 1.5, ORBIT_RADIUS * 1.5); 
    camera.lookAt(sun.position); 

    // --- VÒNG LẶP MÔ PHỎNG ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); 

      if (isRunning) {
        const speed = simulationSpeed; 
        sun.rotation.y += SUN_ROT_SPEED * speed;
        earthMesh.rotation.y += EARTH_ROT_SPEED * speed;
        moon.rotation.y += EARTH_ROT_SPEED * speed; 
        earthOrbit.rotation.y += EARTH_ORBIT_SPEED * speed;
        moonOrbit.rotation.y += MOON_ORBIT_SPEED * speed;
      }

      renderer.render(scene, camera);
    }
    
    animate();

    // --- ĐIỀU KHIỂN ---
    const toggleButton = document.getElementById('toggleButton');
    const speedSlider = document.getElementById('speedSlider');

    toggleButton.addEventListener('click', () => {
      isRunning = !isRunning;
      toggleButton.textContent = isRunning ? '⏸️ Dừng' : '▶️ Tiếp tục';
    });
    
    speedSlider.addEventListener('input', (event) => {
        simulationSpeed = parseFloat(event.target.value); 
    });
    
  </script>
</body>
</html>
