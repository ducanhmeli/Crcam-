<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mô phỏng 3D Hệ Mặt Trời (Three.js)</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #000;
    }

    #scene-container {
      width: 100%;
      height: 100%;
    }

    /* 🌟 Chữ chạy dưới đáy */
    #marquee-container {
      position: absolute;
      bottom: 5px;
      left: 0;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      z-index: 200;
    }

    #marquee-text {
      display: inline-block;
      padding-left: 100%;
      font-size: 14px;
      color: #fff;
      font-weight: 500;
      text-shadow:
        0 0 3px #00ffff,
        0 0 6px #00ffff,
        0 0 12px #00ffff;
      animation: marquee 25s linear infinite;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    .control-btn {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      padding: 10px 25px;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      z-index: 100;
    }

    .control-btn:hover {
      background-color: rgba(255, 255, 255, 0.4);
      color: black;
    }

    #controls {
      position: absolute;
      bottom: 120px;
      right: 30px; 
      background-color: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  
  <div id="scene-container"></div>
  
  <div id="controls"> 
    <label for="speedSlider" style="color: white; margin-right: 10px;">Tốc độ mô phỏng:</label>
    <input type="range" id="speedSlider" min="0.1" max="10" value="1" step="0.1">
  </div>

  <button class="control-btn" id="toggleButton">⏸️ Dừng</button>

  <!-- 🌟 Chữ chạy sát mép dưới -->
  <div id="marquee-container">
    <div id="marquee-text">
      ✨ Mô phỏng chuyển động quay của Hệ Mặt Trời - Trái Đất - Mặt Trăng | 
      Tác giả: Nguyễn Đức Anh | Người hướng dẫn: Nguyễn Duy Quyền ✨
    </div>
  </div>

  <script>
    // --- KHỞI TẠO THREE.JS ---
    const scene = new THREE.Scene();

    // 🌌 ẢNH NỀN
    const textureLoader = new THREE.TextureLoader();
    scene.background = textureLoader.load('space.jpg');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); 
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('scene-container').appendChild(renderer.domElement);
    
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; 
    controls.dampingFactor = 0.05;
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- THAM SỐ ---
    const EARTH_TILT_RAD = 23.5 * Math.PI / 180;
    const ORBIT_RADIUS = 30; 
    const MOON_ORBIT_RADIUS = 5; 
    const BASE_SPEED = 0.0003; 
    const SUN_ROT_SPEED = 0.00003; 
    const EARTH_ORBIT_SPEED = BASE_SPEED * 1; 
    const EARTH_ROT_SPEED = BASE_SPEED * 365.25; 
    const MOON_ORBIT_SPEED = BASE_SPEED * 12.17; 
    let simulationSpeed = 1.0; 
    let isRunning = true;

    // --- VẬT THỂ ---
    const sunGeometry = new THREE.SphereGeometry(4, 32, 32); 
    const sunMaterial = new THREE.MeshBasicMaterial({ 
        map: textureLoader.load('sun.jpg'),
        color: 0xffffee 
    });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);
    
    const light = new THREE.PointLight(0xffffff, 8, 0);
    sun.add(light); 
    scene.add(new THREE.AmbientLight(0x050505));

    const earthGeometry = new THREE.SphereGeometry(1.5, 32, 32);
    const earthMaterial = new THREE.MeshPhongMaterial({ 
        map: textureLoader.load('earth.jpg'),
        specular: 0x333333,
        shininess: 15
    });
    const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
    const earthOrbit = new THREE.Object3D();
    const earthTilt = new THREE.Object3D();
    earthTilt.position.set(ORBIT_RADIUS, 0, 0); 
    earthTilt.rotation.x = EARTH_TILT_RAD; 
    earthOrbit.add(earthTilt); 
    earthTilt.add(earthMesh);
    scene.add(earthOrbit);

    const moonGeometry = new THREE.SphereGeometry(0.4, 32, 32);
    const moonMaterial = new THREE.MeshPhongMaterial({ map: textureLoader.load('moon.jpg') });
    const moon = new THREE.Mesh(moonGeometry, moonMaterial);
    moon.position.set(MOON_ORBIT_RADIUS, 0, 0); 
    const moonOrbit = new THREE.Object3D();
    moonOrbit.add(moon);
    earthMesh.add(moonOrbit); 

    const orbitMaterial = new THREE.LineBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.1 });
    const earthOrbitGeometry = new THREE.RingGeometry(ORBIT_RADIUS - 0.05, ORBIT_RADIUS + 0.05, 128);
    const earthOrbitLine = new THREE.Line(earthOrbitGeometry, orbitMaterial);
    earthOrbitLine.rotation.x = Math.PI / 2; 
    scene.add(earthOrbitLine);

    const moonOrbitGeometry = new THREE.RingGeometry(MOON_ORBIT_RADIUS - 0.02, MOON_ORBIT_RADIUS + 0.02, 64);
    const moonOrbitLine = new THREE.Line(moonOrbitGeometry, orbitMaterial);
    moonOrbitLine.rotation.x = Math.PI / 2; 
    earthMesh.add(moonOrbitLine); 

    camera.position.set(0, ORBIT_RADIUS * 1.5, ORBIT_RADIUS * 1.5); 
    camera.lookAt(sun.position); 

    // --- ANIMATION ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); 
      if (isRunning) {
        const s = simulationSpeed;
        sun.rotation.y += SUN_ROT_SPEED * s;
        earthMesh.rotation.y += EARTH_ROT_SPEED * s;
        moon.rotation.y += EARTH_ROT_SPEED * s; 
        earthOrbit.rotation.y += EARTH_ORBIT_SPEED * s;
        moonOrbit.rotation.y += MOON_ORBIT_SPEED * s;
      }
      renderer.render(scene, camera);
    }
    animate();

    // --- ĐIỀU KHIỂN ---
    const toggleButton = document.getElementById('toggleButton');
    const speedSlider = document.getElementById('speedSlider');
    toggleButton.addEventListener('click', () => {
      isRunning = !isRunning;
      toggleButton.textContent = isRunning ? '⏸️ Dừng' : '▶️ Tiếp tục';
    });
    speedSlider.addEventListener('input', e => simulationSpeed = parseFloat(e.target.value));
  </script>
</body>
</html>
