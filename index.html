<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mô phỏng Hệ Mặt Trời 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
    }

    #controlPanel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.8em 1em;
      border-radius: 0.8em;
      font-size: 0.75em;
      width: 160px;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 200;
      transition: all 0.3s ease;
    }

    #controlPanel:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      border-color: rgba(0, 255, 255, 0.4);
    }

    #controlPanel h3 {
      margin: 0 0 0.5em 0;
      font-size: 0.95em;
      text-align: center;
      font-weight: 600;
      color: #aefcff;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 0.3em;
    }

    .control-group {
      margin: 0.6em 0;
    }

    label {
      display: block;
      margin-bottom: 0.2em;
      color: #e8faff;
      font-weight: 500;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #00d8ff;
      cursor: pointer;
    }

    #speedLabel {
      display: block;
      text-align: right;
      font-weight: bold;
      color: #9effff;
      margin-top: 0.1em;
    }

    #dataBox {
      margin-top: 0.4em;
      font-size: 0.7em;
      background: rgba(0, 255, 255, 0.08);
      padding: 0.4em;
      border-radius: 0.4em;
      white-space: pre;
      border: 1px solid rgba(0, 255, 255, 0.2);
    }

    #note {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 0.8em;
      color: rgba(255, 255, 255, 0.85);
      font-style: italic;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.3em 0.6em;
      border-radius: 0.5em;
      backdrop-filter: blur(4px);
      z-index: 101;
    }
  </style>
</head>
<body>
  <div id="controlPanel">
    <h3>🛰️ Điều khiển</h3>

    <div class="control-group">
      <label for="speedRange">Tốc độ</label>
      <input type="range" id="speedRange" min="0.1" max="10" step="0.1" value="1">
      <span id="speedLabel">1.0x</span>
    </div>

    <div class="control-group">
      <label><input type="checkbox" id="showOrbit" checked> Quỹ đạo</label>
    </div>

    <div class="control-group">
      <label><input type="checkbox" id="showData"> Dữ liệu</label>
    </div>

    <div id="dataBox" style="display:none;">
      t=0.0s<br>θE=0°<br>θM=0°<br>Pha: 🌑 Trăng non
    </div>
  </div>

  <p id="note">🔭 Mô hình 3D khái niệm – không theo tỷ lệ vật lý thực.</p>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>

  <script>
    // Cảnh, camera, renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Ánh sáng
    const pointLight = new THREE.PointLight(0xffffff, 2);
    scene.add(pointLight);

    // 🌞 Mặt trời
    const sunTexture = new THREE.TextureLoader().load('sun.jpg');
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(2, 64, 64),
      new THREE.MeshBasicMaterial({ map: sunTexture })
    );
    scene.add(sun);

    // 🌍 Trái đất
    const earthTexture = new THREE.TextureLoader().load('eartg.gif');
    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 64, 64),
      new THREE.MeshStandardMaterial({ map: earthTexture })
    );
    const earthOrbit = new THREE.Object3D();
    earth.position.x = 6;
    earthOrbit.add(earth);
    scene.add(earthOrbit);

    // 🌕 Mặt trăng
    const moonTexture = new THREE.TextureLoader().load('moon.gif');
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 64, 64),
      new THREE.MeshStandardMaterial({ map: moonTexture })
    );
    const moonOrbit = new THREE.Object3D();
    moon.position.x = 1.5;
    moonOrbit.add(moon);
    earth.add(moonOrbit);

    // 🚀 Camera
    camera.position.z = 15;

    // 💫 Biến điều khiển
    const speedSlider = document.getElementById('speedRange');
    const speedLabel = document.getElementById('speedLabel');
    const showOrbit = document.getElementById('showOrbit');
    const showData = document.getElementById('showData');
    const dataBox = document.getElementById('dataBox');

    let speed = 1;

    speedSlider.addEventListener('input', () => {
      speed = parseFloat(speedSlider.value);
      speedLabel.textContent = speed.toFixed(1) + "x";
    });

    showData.addEventListener('change', () => {
      dataBox.style.display = showData.checked ? 'block' : 'none';
    });

    // 🌑 Hàm xác định pha Mặt Trăng
    function getMoonPhaseSymbol(angle) {
      if (angle < 45 || angle >= 315) return "🌑 Trăng non";
      if (angle < 135) return "🌓 Bán nguyệt đầu";
      if (angle < 225) return "🌕 Trăng tròn";
      return "🌗 Bán nguyệt cuối";
    }

    // 🌀 Render Loop
    let start = Date.now();
    function animate() {
      requestAnimationFrame(animate);

      const t = (Date.now() - start) / 1000;
      earthOrbit.rotation.y = t * 0.3 * speed;
      earth.rotation.y += 0.02 * speed;
      moonOrbit.rotation.y = t * 2 * speed;

      // Dữ liệu hiển thị
      if (showData.checked) {
        const earthAngle = (earthOrbit.rotation.y * 180 / Math.PI) % 360;
        const moonAngle = (moonOrbit.rotation.y * 180 / Math.PI) % 360;
        const phaseAngle = (moonAngle - earthAngle + 360) % 360;
        const phase = getMoonPhaseSymbol(phaseAngle);
        dataBox.innerHTML =
          `t=${t.toFixed(1)}s<br>` +
          `θE=${earthAngle.toFixed(1)}°<br>` +
          `θM=${moonAngle.toFixed(1)}°<br>` +
          `Pha: ${phase}`;
      }

      renderer.render(scene, camera);
    }

    animate();

    // 🔄 Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
