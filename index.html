<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mô phỏng Hệ Mặt Trời - Trái Đất - Mặt Trăng</title>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: url('https://cdn.jsdelivr.net/gh/ducanhmeli/images/space-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      font-family: "Arial", sans-serif;
    }

    #scene-container {
      width: 100%;
      height: 100%;
    }

    /* Nút Dừng / Tiếp tục (giữ nguyên vị trí) */
    #toggle-button {
      position: absolute;
      bottom: 60px;
      right: 30px;
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      padding: 10px 25px;
      font-size: 1.2em;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      z-index: 100;
    }

    #toggle-button:hover {
      background-color: rgba(255, 255, 255, 0.4);
      color: black;
    }

    /* 🌟 Dòng chữ chạy ở DƯỚI TỊT màn hình */
    #footer-container {
      position: absolute;
      bottom: 5px;
      width: 100%;
      overflow: hidden;
      z-index: 200;
      text-align: center;
    }

    #footer-text {
      display: inline-block;
      white-space: nowrap;
      color: #00ffff;
      font-size: 13px;
      font-weight: 400;
      text-shadow: 0 0 6px #00ffff, 0 0 12px #00ffff;
      animation: scrollText 20s linear infinite;
    }

    @keyframes scrollText {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>

<body>
  <div id="scene-container"></div>

  <!-- Giữ nguyên nút Dừng -->
  <button id="toggle-button">⏸️ Dừng</button>

  <!-- 🌍 Dòng chữ chạy ở dưới -->
  <div id="footer-container">
    <div id="footer-text">
      🌍 Mô phỏng chuyển động quay của Hệ Mặt Trời - Trái Đất - Mặt Trăng |
      Tác giả: Nguyễn Đức Anh | Người hướng dẫn: Nguyễn Duy Quyền 🌙
    </div>
  </div>

  <script>
    // --- KHỞI TẠO THREE.JS ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('scene-container').appendChild(renderer.domElement);

    // Ánh sáng
    const light = new THREE.PointLight(0xffffff, 1.5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x333333));

    // Mặt Trời
    const sunTexture = new THREE.TextureLoader().load('https://threejsfundamentals.org/threejs/resources/images/sun.jpg');
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(2, 32, 32),
      new THREE.MeshBasicMaterial({ map: sunTexture })
    );
    scene.add(sun);

    // Trái Đất
    const earthTexture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg');
    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(0.6, 32, 32),
      new THREE.MeshStandardMaterial({ map: earthTexture })
    );
    const earthOrbit = new THREE.Object3D();
    scene.add(earthOrbit);
    earthOrbit.add(earth);
    earth.position.x = 6;

    // Mặt Trăng
    const moonTexture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/moon_1024.jpg');
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 32, 32),
      new THREE.MeshStandardMaterial({ map: moonTexture })
    );
    const moonOrbit = new THREE.Object3D();
    earthOrbit.add(moonOrbit);
    moonOrbit.add(moon);
    moon.position.x = 1;

    // Camera
    camera.position.set(10, 5, 10);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Nút dừng / tiếp tục
    let running = true;
    const toggleButton = document.getElementById("toggle-button");
    toggleButton.addEventListener("click", () => {
      running = !running;
      toggleButton.textContent = running ? "⏸️ Dừng" : "▶️ Tiếp tục";
    });

    // Animation
    function animate() {
      requestAnimationFrame(animate);
      if (running) {
        earthOrbit.rotation.y += 0.01;
        moonOrbit.rotation.y += 0.03;
        earth.rotation.y += 0.02;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // Cập nhật khi thay đổi kích thước
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
