<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mô phỏng Hệ Mặt Trời 3D - Three.js</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    background: radial-gradient(ellipse at center, #000010, #000000 80%);
  }

  canvas {
    display: block;
  }

  /* Giữ nguyên bảng điều khiển Glassmorphism */
  #controlPanel {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 0.8em 1em;
    border-radius: 0.8em;
    font-size: 0.75em;
    width: 160px;
    color: white;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 200;
  }
  #controlPanel h3 { margin: 0 0 0.5em; text-align: center; color: #aefcff; }
  label { display: block; margin-top: 0.3em; }
  #dataBox {
    margin-top: 0.4em;
    font-size: 0.7em;
    background: rgba(0, 255, 255, 0.08);
    padding: 0.4em;
    border-radius: 0.4em;
    border: 1px solid rgba(0, 255, 255, 0.2);
    display: none;
  }
</style>
</head>
<body>

<div id="controlPanel">
  <h3>🛰️ Điều khiển</h3>
  <label>Tốc độ <input type="range" id="speedRange" min="0.2" max="10" step="0.1" value="1"></label>
  <span id="speedLabel">1.0x</span>
  <label><input type="checkbox" id="showOrbit" checked> Quỹ đạo</label>
  <label><input type="checkbox" id="showData"> Dữ liệu</label>
  <div id="dataBox">t=0s<br>θ=0°<br>Pha: 🌑</div>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let sun, earth, moon, earthOrbit, moonOrbit;
let speed = 1.0;
let startTime = performance.now();
const dataBox = document.getElementById('dataBox');
const showData = document.getElementById('showData');
const speedSlider = document.getElementById('speedRange');
const speedLabel = document.getElementById('speedLabel');

init();
animate();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 25, 60);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Ánh sáng
  const pointLight = new THREE.PointLight(0xffffff, 2, 500);
  scene.add(pointLight);

  // Nền sao
  const starTexture = new THREE.TextureLoader().load('sao.jpg');
  const starGeometry = new THREE.SphereGeometry(200, 64, 64);
  const starMaterial = new THREE.MeshBasicMaterial({ map: starTexture, side: THREE.BackSide });
  const starField = new THREE.Mesh(starGeometry, starMaterial);
  scene.add(starField);

  // Mặt Trời
  const sunTexture = new THREE.TextureLoader().load('sun.jpg');
  const sunMat = new THREE.MeshBasicMaterial({ map: sunTexture });
  sun = new THREE.Mesh(new THREE.SphereGeometry(5, 64, 64), sunMat);
  scene.add(sun);

  // Trái Đất
  const earthTexture = new THREE.TextureLoader().load('eartg.gif');
  const earthMat = new THREE.MeshPhongMaterial({
    map: earthTexture,
    shininess: 10
  });
  earth = new THREE.Mesh(new THREE.SphereGeometry(1.5, 64, 64), earthMat);

  // Mặt Trăng
  const moonTexture = new THREE.TextureLoader().load('moon.gif');
  const moonMat = new THREE.MeshPhongMaterial({
    map: moonTexture,
    shininess: 5
  });
  moon = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), moonMat);

  // Tạo quỹ đạo
  earthOrbit = new THREE.Object3D();
  moonOrbit = new THREE.Object3D();
  scene.add(earthOrbit);
  earthOrbit.add(earth);
  earth.add(moonOrbit);
  moonOrbit.add(moon);

  earth.position.set(15, 0, 0);
  moon.position.set(3, 0, 0);

  // Orbit helper (hiển thị quỹ đạo)
  const orbitMat = new THREE.LineBasicMaterial({ color: 0x44ccff });
  const orbitGeo = new THREE.BufferGeometry().setFromPoints(createCirclePoints(15, 128));
  const earthOrbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
  scene.add(earthOrbitLine);

  const moonOrbitGeo = new THREE.BufferGeometry().setFromPoints(createCirclePoints(3, 64));
  const moonOrbitLine = new THREE.LineLoop(moonOrbitGeo, orbitMat);
  moonOrbit.add(moonOrbitLine);

  window.addEventListener('resize', onWindowResize);

  // Điều khiển
  speedSlider.addEventListener('input', () => {
    speed = parseFloat(speedSlider.value);
    speedLabel.textContent = speed.toFixed(1) + "x";
  });
}

function createCirclePoints(radius, segments) {
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const theta = (i / segments) * 2 * Math.PI;
    pts.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
  }
  return pts;
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const now = (performance.now() - startTime) / 1000 * speed;

  // Quay quanh Mặt Trời & Mặt Trăng
  earthOrbit.rotation.y = now * (Math.PI * 2 / 36.5);
  moonOrbit.rotation.y = now * (Math.PI * 2 / 2.7);
  earth.rotation.y += 0.01 * speed;
  moon.rotation.y += 0.005 * speed;

  // Cập nhật dữ liệu
  if (showData.checked) {
    const earthAngle = ((now * 360) / 36.5) % 360;
    const moonAngle = ((now * 360) / 2.7) % 360;
    const phaseAngle = (moonAngle - earthAngle + 360) % 360;
    let phase = "🌑";
    if (phaseAngle < 45 || phaseAngle >= 315) phase = "🌑 Trăng non";
    else if (phaseAngle < 135) phase = "🌓 Bán nguyệt đầu";
    else if (phaseAngle < 225) phase = "🌕 Trăng tròn";
    else phase = "🌗 Bán nguyệt cuối";
    dataBox.style.display = "block";
    dataBox.innerHTML = `t=${now.toFixed(1)}s<br>θE=${earthAngle.toFixed(1)}°<br>θM=${moonAngle.toFixed(1)}°<br>Pha: ${phase}`;
  } else dataBox.style.display = "none";

  renderer.render(scene, camera);
}
</script>
</body>
</html>
