<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mô phỏng Hệ Mặt Trời - Trái Đất - Mặt Trăng</title>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: url('https://cdn.jsdelivr.net/gh/ducanhmeli/images/space-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      font-family: "Arial", sans-serif;
    }

    #scene-container {
      width: 100%;
      height: 100%;
    }

    /* 🎛️ Nút dừng / tiếp tục */
    #toggle-button {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      font-size: 16px;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: 1px solid cyan;
      border-radius: 6px;
      cursor: pointer;
      z-index: 100;
      text-shadow: 0 0 8px cyan;
    }

    #toggle-button:hover {
      background-color: rgba(0, 255, 255, 0.2);
    }

    /* 🌟 Dòng chữ mô phỏng (ở dưới cùng, phát sáng nhẹ) */
    #footer-text {
      position: absolute;
      bottom: 8px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #f2f2f2;
      font-weight: 400;
      text-shadow: 
        0 0 3px #00ffff,
        0 0 6px #00ffff;
      z-index: 200;
      letter-spacing: 0.3px;
    }
  </style>
</head>

<body>
  <div id="scene-container"></div>
  <button id="toggle-button">⏸️ Dừng</button>

  <!-- 🌍 Dòng chữ dưới cùng -->
  <div id="footer-text">
    Mô phỏng chuyển động quay của Hệ Mặt Trời - Trái Đất - Mặt Trăng<br>
    Tác giả: Nguyễn Đức Anh | Giáo Viên hướng dẫn: Nguyễn Duy Quyền
  </div>

  <script>
    // 🎬 Tạo scene, camera, renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById("scene-container").appendChild(renderer.domElement);

    // 💡 Ánh sáng
    const light = new THREE.PointLight(0xffffff, 1.5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x333333));

    // 🌞 Mặt trời
    const sunTexture = new THREE.TextureLoader().load('https://threejsfundamentals.org/threejs/resources/images/sun.jpg');
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(2, 32, 32),
      new THREE.MeshBasicMaterial({ map: sunTexture })
    );
    scene.add(sun);

    // 🌍 Trái đất
    const earthTexture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg');
    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(0.6, 32, 32),
      new THREE.MeshStandardMaterial({ map: earthTexture })
    );
    const earthOrbit = new THREE.Object3D();
    scene.add(earthOrbit);
    earthOrbit.add(earth);
    earth.position.x = 6;

    // 🌙 Mặt trăng
    const moonTexture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/moon_1024.jpg');
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 32, 32),
      new THREE.MeshStandardMaterial({ map: moonTexture })
    );
    const moonOrbit = new THREE.Object3D();
    earthOrbit.add(moonOrbit);
    moonOrbit.add(moon);
    moon.position.x = 1;

    // 🎥 Camera
    camera.position.set(10, 5, 10);

    // 🎮 Orbit controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // 🌀 Chuyển động
    let running = true;
    document.getElementById("toggle-button").addEventListener("click", () => {
      running = !running;
      document.getElementById("toggle-button").textContent = running ? "⏸️ Dừng" : "▶️ Tiếp tục";
    });

    function animate() {
      requestAnimationFrame(animate);
      if (running) {
        earthOrbit.rotation.y += 0.01;
        moonOrbit.rotation.y += 0.03;
        earth.rotation.y += 0.02;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // 🔄 Khi thay đổi kích thước cửa sổ
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
